name: Build & Release Vertex Chat APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: JDK 17 • Test, Lint, Build Debug & Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure .env exists from .env.example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertex-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode Release Keystore & Build Signed Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/release-keystore.jks"
            gradle :app:assembleRelease \
              -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
          else
            echo "KEYSTORE_BASE64 secret not configured; signing release APK with debug keystore fallback for artifact generation."
            cp debug.keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" || true
            STORE_PASSWORD=android KEY_PASSWORD=android gradle :app:assembleRelease || true
          fi

      - name: Upload Release APK Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vertex-chat-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Extract Version Name from app/build.gradle.kts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: extract_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          echo "tag=v${VERSION_NAME}-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.tag }}
          name: "Vertex Chat ${{ steps.extract_version.outputs.tag }}"
          body: |
            Automated build of **Vertex Chat** (`v${{ steps.extract_version.outputs.version }}`).
            Includes AMOLED Material 3 UI, Keystore-encrypted Vertex AI OAuth2 Service Account vault, isolated per-chat Virtual File System (VFS), and WorkManager background generation.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
